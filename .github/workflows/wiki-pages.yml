name: Site to GitHub Pages

# Publishes the OCTAVE project site at robdegeorge.com/OCTAVE/ (the project site
# inherits the RobDeGeorge.github.io user site's custom domain; no CNAME here).
# Layout of the deployed site:
#   /OCTAVE/            the app, built for the browser with Qt for WebAssembly
#                       (packaging/wasm/build.sh + packaging/wasm/index.html)
#   /OCTAVE/playground.html  the frontend playground: web frontends against the
#                       same core (packaging/wasm/playground.html), with the
#                       bundled ones under /OCTAVE/frontends/
#   /OCTAVE/wiki/       wiki/, minus the index builder scripts
#   /OCTAVE/<page>.html redirect stubs to /OCTAVE/wiki/<page>.html, generated
#                       here so the old wiki links keep working
# The wiki uses relative links only, so it works under any subpath unchanged.
# Pages must be switched on once with source "GitHub Actions" (Settings -> Pages,
# or POST repos/RobDeGeorge/OCTAVE/pages build_type=workflow).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'CMakeLists.txt'
      - 'packaging/wasm/**'
      - 'wiki/**'
      - 'templates/hello-car-js/**'
      - 'examples/frontends/glass/**'
      - 'examples/frontends/sunlight/**'
      - 'examples/frontends/arcade/**'
      - 'examples/frontends/console/**'
      - 'examples/frontends/retro-cluster/**'
      - 'sdk/typescript/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0'
  # Qt 6.12's QT_EMCC_RECOMMENDED_VERSION; the build warns on any other.
  EMSDK_VERSION: '5.0.5'
  QT_MODULES: 'qt5compat qtmultimedia qtquick3d qtquicktimeline qtwebsockets qtshadertools'

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      # The desktop kit first: the wasm cross build runs its host tools (moc,
      # qsb, balsam, qmlimportscanner) from here, so it needs the same modules.
      - name: Install host Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt
          cache: true
          set-env: false
      - name: Install Qt ${{ env.QT_VERSION }} for WebAssembly
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_multithread'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt
          cache: true
          set-env: false
      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e  # v15
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'
      # The playground's bundled glass frontend (build.sh stages dist/)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Build the glass example frontend
        run: |
          npm --prefix sdk/typescript ci --no-audit --no-fund
          npm --prefix examples/frontends/glass ci --no-audit --no-fund
          npm --prefix examples/frontends/glass run build
      # The native examples that also build for the browser (stage_frontends.py
      # stages each dist-web/): sunlight with Go's js/wasm port, the arcade with
      # the emsdk installed above (its first run builds the SDL2 port),
      # retro-cluster with Rust's wasm32 target and the wasm-bindgen program of
      # the version its Cargo.lock names (the release binary, not a compile)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: examples/frontends/sunlight/go.mod
          cache-dependency-path: examples/frontends/sunlight/go.sum
      - name: Rust's wasm32 target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' examples/frontends/retro-cluster/Cargo.lock)
          # The program is run by the build of a page this workflow publishes, so
          # it is checked against a hash kept here, not trusted as downloaded.
          # A Cargo.lock that moves to another version fails here until its
          # hash is added: sha256 of the release's
          # wasm-bindgen-<version>-x86_64-unknown-linux-musl.tar.gz
          case "$v" in
            0.2.129) sha=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e ;;
            *) echo "::error::no pinned sha256 for wasm-bindgen $v (see this step in wiki-pages.yml)"; exit 1 ;;
          esac
          f="wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build the sunlight, arcade and retro-cluster examples for the browser
        run: |
          (cd examples/frontends/sunlight && bash build_web.sh)
          (cd examples/frontends/arcade && bash build_web.sh)
          (cd examples/frontends/retro-cluster && bash build_web.sh)
      - name: Build and stage
        run: |
          QT_HOST="$RUNNER_TEMP/qt/Qt/$QT_VERSION/gcc_64" \
          QT_WASM="$RUNNER_TEMP/qt/Qt/$QT_VERSION/wasm_multithread" \
          BUILD_DIR="$RUNNER_TEMP/build-wasm" \
          OUT_DIR="$GITHUB_WORKSPACE/wasm-site" \
          bash packaging/wasm/build.sh
          du -sh wasm-site
      # Both bundled frontends must show live values from the core in the
      # playground (headless Chrome). Advisory until it has a few green runs
      # on the hosted runners
      - name: Check the frontend playground
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 packaging/wasm/serve.py wasm-site 8091 &
          server=$!
          CHROME=google-chrome node packaging/wasm/check_playground.mjs http://127.0.0.1:8091/
          status=$?
          kill $server
          exit $status
      # The Web Serial OBD transport against a fake ELM327 on a fake
      # navigator.serial: connect, replug, hand-over to the simulated car
      - name: Check the Web Serial adapter path
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 packaging/wasm/serve.py wasm-site 8092 &
          server=$!
          CHROME=google-chrome node packaging/wasm/check_webserial.mjs http://127.0.0.1:8092/
          status=$?
          kill $server
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: octave-wasm
          path: wasm-site
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Stage the app at the site root
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: octave-wasm
          path: _site
      - name: Stage wiki under wiki/ (minus the index builder scripts)
        run: |
          mkdir -p _site/wiki
          rsync -a --exclude '*.py' --exclude '__pycache__' wiki/ _site/wiki/
          touch _site/.nojekyll
      - name: Redirect stubs for the old /OCTAVE/<page>.html wiki links
        run: |
          for src in wiki/*.html; do
            page="$(basename "$src")"
            [ "$page" = index.html ] && continue   # the root index.html is the app
            cat > "_site/$page" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>OCTAVE wiki</title>
            <meta http-equiv="refresh" content="0; url=wiki/$page">
            <link rel="canonical" href="https://robdegeorge.com/OCTAVE/wiki/$page">
            <script>location.replace('wiki/$page' + location.search + location.hash);</script>
          </head>
          <body><p><a href="wiki/$page">This page has moved to the wiki.</a></p></body>
          </html>
          HTML
          done
          ls -la _site | head -20
          du -sh _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
