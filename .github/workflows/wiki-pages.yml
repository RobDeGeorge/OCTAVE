name: Site to GitHub Pages

# Publishes the OCTAVE project site at robdegeorge.com/OCTAVE/ (the project site
# inherits the RobDeGeorge.github.io user site's custom domain; no CNAME here).
# Layout of the deployed site:
#   /OCTAVE/            the app, built for the browser with Qt for WebAssembly
#                       (packaging/wasm/build.sh + packaging/wasm/index.html)
#   /OCTAVE/playground.html  the frontend playground: web frontends against the
#                       same core (packaging/wasm/playground.html), with the
#                       bundled ones under /OCTAVE/frontends/
#   /OCTAVE/wiki/       wiki/, minus the index builder scripts
#   /OCTAVE/<page>.html redirect stubs to /OCTAVE/wiki/<page>.html, generated
#                       here so the old wiki links keep working
# The wiki uses relative links only, so it works under any subpath unchanged.
# Pages must be switched on once with source "GitHub Actions" (Settings -> Pages,
# or POST repos/RobDeGeorge/OCTAVE/pages build_type=workflow).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'CMakeLists.txt'
      - 'packaging/wasm/**'
      - 'wiki/**'
      - 'templates/hello-car-js/**'
      - 'examples/frontends/glass/**'
      - 'examples/frontends/sunlight/**'
      - 'examples/frontends/arcade/**'
      - 'examples/frontends/console/**'
      - 'examples/frontends/retro-cluster/**'
      - 'sdk/typescript/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0'
  # Qt 6.12's QT_EMCC_RECOMMENDED_VERSION; the build warns on any other.
  EMSDK_VERSION: '5.0.5'
  QT_MODULES: 'qt5compat qtmultimedia qtquick3d qtquicktimeline qtwebsockets qtshadertools'

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      # The desktop kit first: the wasm cross build runs its host tools (moc,
      # qsb, balsam, qmlimportscanner) from here, so it needs the same modules.
      - name: Install host Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt
          cache: true
          set-env: false
      - name: Install Qt ${{ env.QT_VERSION }} for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_multithread'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt
          cache: true
          set-env: false
      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'
      # The playground's bundled glass frontend (build.sh stages dist/)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the glass example frontend
        run: |
          npm --prefix sdk/typescript ci --no-audit --no-fund
          npm --prefix examples/frontends/glass ci --no-audit --no-fund
          npm --prefix examples/frontends/glass run build
      # The native examples that also build for the browser (stage_frontends.py
      # stages each dist-web/): sunlight with Go's js/wasm port, the arcade with
      # the emsdk installed above (its first run builds the SDL2 port)
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/frontends/sunlight/go.mod
          cache-dependency-path: examples/frontends/sunlight/go.sum
      - name: Build the sunlight and arcade examples for the browser
        run: |
          (cd examples/frontends/sunlight && ./build_web.sh)
          (cd examples/frontends/arcade && ./build_web.sh)
      - name: Build and stage
        run: |
          QT_HOST="$RUNNER_TEMP/qt/Qt/$QT_VERSION/gcc_64" \
          QT_WASM="$RUNNER_TEMP/qt/Qt/$QT_VERSION/wasm_multithread" \
          BUILD_DIR="$RUNNER_TEMP/build-wasm" \
          OUT_DIR="$GITHUB_WORKSPACE/wasm-site" \
          bash packaging/wasm/build.sh
          du -sh wasm-site
      # Both bundled frontends must show live values from the core in the
      # playground (headless Chrome). Advisory until it has a few green runs
      # on the hosted runners
      - name: Check the frontend playground
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 packaging/wasm/serve.py wasm-site 8091 &
          server=$!
          CHROME=google-chrome node packaging/wasm/check_playground.mjs http://127.0.0.1:8091/
          status=$?
          kill $server
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: octave-wasm
          path: wasm-site
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the app at the site root
        uses: actions/download-artifact@v4
        with:
          name: octave-wasm
          path: _site
      - name: Stage wiki under wiki/ (minus the index builder scripts)
        run: |
          mkdir -p _site/wiki
          rsync -a --exclude '*.py' --exclude '__pycache__' wiki/ _site/wiki/
          touch _site/.nojekyll
      - name: Redirect stubs for the old /OCTAVE/<page>.html wiki links
        run: |
          for src in wiki/*.html; do
            page="$(basename "$src")"
            [ "$page" = index.html ] && continue   # the root index.html is the app
            cat > "_site/$page" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>OCTAVE wiki</title>
            <meta http-equiv="refresh" content="0; url=wiki/$page">
            <link rel="canonical" href="https://robdegeorge.com/OCTAVE/wiki/$page">
            <script>location.replace('wiki/$page' + location.search + location.hash);</script>
          </head>
          <body><p><a href="wiki/$page">This page has moved to the wiki.</a></p></body>
          </html>
          HTML
          done
          ls -la _site | head -20
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
