# #######################################################################################
# HYPRLAND CONFIG - ORANGE PI 5 PLUS (Armbian, Hyprland 0.53)
# #######################################################################################
# Ported from zion's hyprland.conf: same keybinds and look, NVIDIA env and
# wallpaper theming engine removed, static dark theme.
# https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

# Dash display on HDMI - use whatever native res the connected screen reports
# (Jeep: Chi Mei PMX-G101 10.1" 1280x800; old ultrawide was 2560x1080)
monitor=HDMI-A-2,preferred,0x0,1

# Fallback for any other monitors
monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = pkill wofi || wofi --show drun

#################
### AUTOSTART ###
#################

# exec-once = waybar (started by systemd user service)
# exec-once = mako (started by systemd user service)
# exec-once = hyprpaper (started by systemd user service)
exec-once = nm-applet --indicator
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1

# Portals get Wayland env vars + activate the systemd graphical session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hyprland-session.target

# OCTAVE infotainment (single-instance launcher)
exec-once = ~/.local/bin/octave-start.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = GDK_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GTK_THEME,Adwaita:dark

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 10
    gaps_out = 10

    border_size = 3

    # Plain dark theme: light grey active border, dark grey inactive
    col.active_border = rgba(e6e6e6ee)
    col.inactive_border = rgba(3a3a3aaa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.5, easeOutQuint, slide
    animation = workspacesIn, 1, 2.5, easeOutQuint, slide
    animation = workspacesOut, 1, 2.5, easeOutQuint, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

group {
    col.border_active = rgba(e6e6e6ee)
    col.border_inactive = rgba(3a3a3aaa)

    groupbar {
        font_size = 10
        gradients = false
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 0.3
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ====================================
# Applications
# ====================================

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, exec, chromium
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, gnome-calculator
bind = $mainMod, A, exec, pavucontrol

# ====================================
# Window Management
# ====================================

bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, Space, focusurgentorlast,

bind = $mainMod, H, layoutmsg, togglesplit
bind = $mainMod, V, exec, hyprctl dispatch layoutmsg orientationnext

# ====================================
# Focus Navigation
# ====================================

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, L, movefocus, u
bind = $mainMod, semicolon, movefocus, r

# ====================================
# Move Windows
# ====================================

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

bind = $mainMod SHIFT, J, movewindow, l
bind = $mainMod SHIFT, K, movewindow, d
bind = $mainMod SHIFT, L, movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r

# ====================================
# Workspaces
# ====================================

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

bind = $mainMod, Page_Down, workspace, r+1
bind = $mainMod, Page_Up, workspace, r-1

# ====================================
# Screenshots
# ====================================

bind = , F12, exec, bash -c 'F=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && mkdir -p ~/Pictures/Screenshots && grim "$F" && wl-copy < "$F" && notify-send "Screenshot saved & copied"'
bind = $mainMod, F12, exec, bash -c 'F=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S_area.png) && mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" "$F" && wl-copy < "$F" && notify-send "Area screenshot saved & copied"'

# ====================================
# Gap Controls
# ====================================

bind = $mainMod, equal, exec, hyprctl keyword general:gaps_in $(($(hyprctl getoption general:gaps_in -j | jq '.int') + 5))
bind = $mainMod, minus, exec, hyprctl keyword general:gaps_in $(($(hyprctl getoption general:gaps_in -j | jq '.int') - 5))
bind = $mainMod SHIFT, equal, exec, hyprctl keyword general:gaps_out $(($(hyprctl getoption general:gaps_out -j | jq '.int') + 5))
bind = $mainMod SHIFT, minus, exec, hyprctl keyword general:gaps_out $(($(hyprctl getoption general:gaps_out -j | jq '.int') - 5))

# ====================================
# System Controls
# ====================================

bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, E, exit,

# ====================================
# Window Grouping (Stacked Windows)
# ====================================

bind = $mainMod, G, togglegroup
bind = ALT, Tab, changegroupactive, f
bind = ALT SHIFT, Tab, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup

# ====================================
# Resize Mode
# ====================================

bind = $mainMod, R, submap, resize

submap = resize

binde = , J, resizeactive, -10 0
binde = , K, resizeactive, 0 10
binde = , L, resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0

binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0

bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mainMod, R, submap, reset

submap = reset

# ====================================
# Media Keys
# ====================================

bindel = ,XF86AudioRaiseVolume, exec, pamixer -i 10 && notify-send -t 1000 "Volume: $(pamixer --get-volume)%"
bindel = ,XF86AudioLowerVolume, exec, pamixer -d 10 && notify-send -t 1000 "Volume: $(pamixer --get-volume)%"
bindel = ,XF86AudioMute, exec, pamixer -t && notify-send -t 1000 "Volume: $(pamixer --get-volume-human)"

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ====================================
# Mouse Controls
# ====================================

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppress_event maximize, match:class .*

# Pavucontrol: floating popup instead of tiled
windowrule = float 1, match:class ^org.pulseaudio.pavucontrol$
windowrule = size 1134 621, match:class ^org.pulseaudio.pavucontrol$
windowrule = center 1, match:class ^org.pulseaudio.pavucontrol$

# OCTAVE: keep on the dash display (fullscreen rule disabled)
# windowrule = fullscreen 1, match:class ^octave$   # disabled: let OCTAVE honor its own windowed setting
windowrule = monitor HDMI-A-2, match:class ^octave$

# Wofi animations
layerrule = animation popin, match:namespace wofi
layerrule = blur on, match:namespace wofi

# Waybar blur
layerrule = blur on, match:namespace waybar

##########################
### TOUCHSCREEN (hyprgrass)
##########################
# Plugin built from ~/src/hyprgrass (pinned to commit for Hyprland 0.53.3).
# If you upgrade Hyprland, rebuild it or Hyprland may refuse to load it.
# Locally patched so a cancelled 3-finger swipe never leaves a workspace half-slid:
# ~/src/hyprgrass-stuck-swipe.patch (re-apply with git apply when rebuilding).
plugin = /home/roxy/.local/lib/hyprland/libhyprgrass.so

# 4-finger tap: closes the focused window (like Mod+Shift+Q),
# or opens a terminal if the workspace is empty
hyprgrass-bind = , tap:4, exec, ~/.config/hypr/scripts/tap4.sh

# 3-finger horizontal swipe slides between workspaces (follows your fingers)
hyprgrass-gesture = swipe, 3, horizontal, workspace

# Swipe sensitivity (default 1.0): higher starts the swipe sooner but is stricter
# about fingers moving together; above ~2-3 swipes start getting cancelled.
plugin {
    touch_gestures {
        sensitivity = 2.0
    }
}

# Switch workspace once the swipe is 15% of the way across (default 50%)
gestures {
    workspace_swipe_cancel_ratio = 0.15
}

# On-screen keyboard (~/.local/bin/osk, toggled from the Waybar keyboard icon):
# floating, on every workspace; doesn't grab focus on open or mouse-over, and hands
# focus back to your app before each keypress (no_focus would block taps entirely)
windowrule = float 1, match:class ^osk$
windowrule = pin 1, match:class ^osk$
windowrule = no_initial_focus 1, match:class ^osk$
windowrule = no_follow_mouse 1, match:class ^osk$
windowrule = border_size 0, match:class ^osk$
windowrule = no_shadow 1, match:class ^osk$
windowrule = opacity 0.8 override 0.8 override, match:class ^osk$  # a bit see-through
