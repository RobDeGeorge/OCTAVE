# OCTAVE-Jeep: local-only AP for wireless phone mirroring (scrcpy/adb over Wi-Fi).
# Runs on the virtual interface ap0 (created by ap0-iface.service) alongside the
# wlP2p33s0 station. NetworkManager must NOT manage ap0: its wpa_supplicant flips
# ap0 to managed mode and rtw89 allows only one managed iface (#{managed} <= 1).
interface=ap0
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0

ssid=OCTAVE-Jeep
country_code=US
ieee80211d=1

# Channel is pinned, no ACS:
# - rtw89 on RTL8852BE allows #channels <= 1, so AP and station must share a channel.
#   Put this on the same channel as the Wi-Fi the Pi joins at home, so the AP and
#   client never fight over channels when the car is in the driveway.
# - 44 is US UNII-1, non-DFS: no radar CAC delay at start, no forced channel moves.
hw_mode=a
channel=44
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
# 80 MHz: channels 36-48, center 42. 44 pairs upward with 48 for HT40 -> [HT40+].
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
vht_capab=[SHORT-GI-80]

# WPA2-PSK, CCMP only.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=<REDACTED>
