# DHCP-only server for OCTAVE-Jeep (ap0). Deliberately hands out NO default
# gateway (option 3) and NO DNS (option 6) so Android can't validate this Wi-Fi
# and keeps mobile data as its internet/default network.
interface=ap0
bind-interfaces
except-interface=lo
port=0
dhcp-range=10.42.0.10,10.42.0.50,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq-ap0.leases
pid-file=/run/dnsmasq-ap0.pid
log-dhcp
# Fixed lease for the phone. Android randomizes its MAC per SSID; read it from the
# lease file after the phone joins once, then pin it here.
dhcp-host=<PHONE-MAC>,phone,10.42.0.30
