[package]
name = "retro-cluster"
version = "0.1.0"
edition = "2024"
description = "An experimental OCTAVE frontend: a retro VFD instrument cluster in Rust + egui, over the service API"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
