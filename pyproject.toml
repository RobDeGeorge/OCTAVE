[project]
name = "octave"
version = "0.9.0"
description = "OCTAVE - Open-source Cross-platform Telematics for Augmented Vehicle Experience"
requires-python = ">=3.10"

dependencies = [
    "PySide6>=6.8.0",
    "mutagen==1.47.0",
    "spotipy>=2.25.2",
    "requests>=2.25.0",
    "yt-dlp>=2026.8.19",
    "ytmusicapi==1.11.5",
    "rapidfuzz>=3.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "venv",
    "dev",
    "dist",
    "build",
    "build-android",
    "__pycache__",
    "tools",
    "wiki",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "E722", # bare except
    "B",    # flake8-bugbear (includes B904 raise-from)
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long — existing long lines, revisit later
    "E402", # module import not at top — main.py does sys.path twiddling first
    "F401", # imported but unused — re-exports and conditional imports
    "B008", # function call in default arg — common Qt pattern
    "UP007", # Optional/Union style — keep flexible for now
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/*" = ["E402"]
