# Ruff settings for the repo's Python tools (scripts/, packaging/; dev/ and tools/ are excluded).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "venv",
    "dev",
    "dist",
    "build",
    "build-android",
    "__pycache__",
    "tools",
    "wiki",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "E722", # bare except
    "B",    # flake8-bugbear (includes B904 raise-from)
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long — existing long lines, revisit later
    "E402", # module import not at top — scripts that adjust sys.path first
    "F401", # imported but unused — re-exports and conditional imports
    "B008", # function call in default arg — common Qt pattern
    "UP007", # Optional/Union style — keep flexible for now
]
